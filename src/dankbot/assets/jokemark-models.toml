# jokemark model matrix — the plan for `dank-bot jokemark`.
#
# Every `[[models]]` entry is one *bank* of runs: a model plus the sampler it is
# chatted with, run against every line of the packaged overheard corpus. TOML
# (rather than JSON) so this file can explain itself — see docs/plans/jokemark.md.
#
# Per-entry keys (all optional except `model`):
#   model        Ollama model name, e.g. "hf.co/org/repo:Q4_K_M"   (required)
#   label        report heading; must be unique; defaults to the model leaf name
#   temperature  sampler temperature; 0.0 is near-greedy              (default 0.85)
#   min_p        min-p sampling floor, 0..1                           (default 0.05)
#   ctx          context window in tokens                             (default 4096)
#   max_tokens   reply cap in tokens                                  (default 120)
#   native       true → Ollama /api/chat, false → OpenAI /v1          (CLI flag)
#   timeout      per-request chat timeout in seconds                  (CLI flag)
#
# `[defaults]` (same knobs, minus model/label) applies to every entry; an entry
# overrides it. Anything still unset falls back to dankbot.config's DEFAULT_*.
#
# To retire a candidate, comment out its `# [[models]]` block and leave the
# verdict beside it ("# disabled: very unfunny") — the record of having tried it
# is worth more than a deleted entry.

version = 1

[defaults]
temperature = 0.85
min_p = 0.05
ctx = 4096
max_tokens = 120

# --- models already evaluated -------------------------------------------------

# The disciplined baseline — `DEFAULT_MODEL` until the Rocinante-X run.
[[models]]
model = "hf.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF:latest"
label = "hermes-3-8b"

# The former default's 12B alternative from docs/plans/initial.md. Q8_0 is
# the biggest quant that still fits beside everything else on the 16 GB Pi 5.
[[models]]
model = "hf.co/bartowski/Human-Like-Mistral-Nemo-Instruct-2407-GGUF:Q8_0"
label = "human-like-nemo-12b"

# The two t= variants exercise the parameter axis and answer the sampler
# question (does heat help or hurt?) with evidence instead of feel.

# Near-greedy: the model should be consistent but repeat itself.
[[models]]
model = "hf.co/NousResearch/Hermes-3-Llama-3.1-8B-GGUF:latest"
label = "hermes-3-8b t=0.0"
temperature = 0.0

# Hot: expected to be wilder, at the risk of incoherence.
[[models]]
model = "hf.co/bartowski/Human-Like-Mistral-Nemo-Instruct-2407-GGUF:Q8_0"
label = "human-like-nemo-12b t=1.0"
temperature = 1.0

# --- smaller Q4_K_M candidates ------------------------------------------------
#
# Q4_K_M is the quant that fits a 16 GB Pi 5 alongside the rest of the stack.
# Rocinante won this group; the other three are retired, with their verdicts.

# A 12B "Rocinante" merge — **the current DEFAULT_MODEL**: the funniest of the
# batch in the bake-off, and Q4_K_M keeps it Pi-sized.
[[models]]
model = "hf.co/TheDrummer/Rocinante-X-12B-v1-GGUF:Q4_K_M"
label = "rocinante-x-12b"

