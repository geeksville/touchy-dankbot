# jokemark model matrix — the plan for `dankbot jokemark`.
#
# Every `[[models]]` entry is one *bank* of runs: a model plus the sampler it is
# chatted with, run against every line of the packaged overheard corpus. TOML
# (rather than JSON) so this file can explain itself — see docs/plans/jokemark.md.
#
# Per-entry keys (all optional except `model`):
#   model        Ollama model name, e.g. "hf.co/org/repo:Q4_K_M"   (required)
#   label        report heading; must be unique; defaults to the model leaf name
#   temperature  sampler temperature; 0.0 is near-greedy              (default 0.85)
#   min_p        min-p sampling floor, 0..1                           (default 0.05)
#   ctx          context window in tokens                             (default 4096)
#   max_tokens   reply cap in tokens                                  (default 120)
#   native       true → Ollama /api/chat, false → OpenAI /v1          (CLI flag)
#   timeout      per-request chat timeout in seconds                  (CLI flag)
#
# `[defaults]` (same knobs, minus model/label) applies to every entry; an entry
# overrides it. Anything still unset falls back to dankbot.config's DEFAULT_*.
#
# To retire a candidate, comment out its `# [[models]]` block and leave the
# verdict beside it ("# disabled: very unfunny") — the record of having tried it
# is worth more than a deleted entry.
#
# Active today: *one* model (Rocinante-X 12B) at three quants — the quant sweep
# below. Everything else has been rejected by ear and lives on as a
# commented-out block.

version = 1

[defaults]
temperature = 0.85
min_p = 0.05
ctx = 4096
max_tokens = 120

# --- active: Rocinante-X 12B, one bank per quant ------------------------------
#
# One model, three quants, an identical sampler — so the quant is the *only*
# axis, and the report's per-row `s` column answers "is a smaller quant faster?"
# with evidence. On disk: Q2_K ≈ 4.8 GB, Q3_K_M ≈ 6.1 GB, Q4_K_M ≈ 7.5 GB.
# llama.cpp generation is memory-bandwidth-bound, so the smaller quants should
# generate roughly in proportion to their size (Q3_K_M ≈ 20% faster than
# Q4_K_M, Q2_K ≈ 50%+); prompt processing is compute-bound and gains less. The
# trade is quality: Q3_K_M is the usual sweet spot for a 12B, Q2_K the cliff.
# Whichever quant wins keeps the plain `rocinante-x-12b` label and becomes
# `DEFAULT_MODEL` in config.py.

# Baseline: the current DEFAULT_MODEL (Q4_K_M) — the quips to beat.
[[models]]
model = "hf.co/TheDrummer/Rocinante-X-12B-v1-GGUF:Q4_K_M"
label = "rocinante-x-12b"

# Middle quant: ~20% fewer bytes to move per token than Q4_K_M.
[[models]]
model = "hf.co/TheDrummer/Rocinante-X-12B-v1-GGUF:Q3_K_M"
label = "rocinante-x-12b q3_k_m"

# Smallest quant: the fast end of the sweep; watch for incoherence here.
[[models]]
model = "hf.co/TheDrummer/Rocinante-X-12B-v1-GGUF:Q2_K"
label = "rocinante-x-12b q2_k"

