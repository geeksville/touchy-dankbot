# touchy-dankbot — Poetry project.
#
# The distribution (PyPI) name is `touchy-dankbot`; the console script and the
# import package are both `dankbot` (a hyphen cannot appear in a Python
# identifier, and `dankbot` reads better in code than dissertation-length names).
# The `touchy-pad` host library comes from
# PyPI, not a local path checkout — `just use-touchy-local` clones upstream into
# reference/touchy-pad and swaps in that checkout's app/ tree while hacking on
# the host library itself. See docs/plans/standalone.md.

[tool.poetry]
name = "touchy-dankbot"
version = "0.1.1"
description = "An eavesdropping desk robot: witty one-liners about overheard conversation, via a remote LLM."
authors = ["Touchy-Pad contributors"]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["voice", "llm", "speech-to-text", "funny", "touchy-pad", "esp32"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "dankbot", from = "src" }]
# The jokemark corpus + model matrix are data files inside the package, read via
# importlib.resources. Name them explicitly so both the wheel and the sdist carry
# them regardless of Poetry's package-data defaults.
include = [{ path = "src/dankbot/assets", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
# Match the touchy-pad host stack's supported range.
python = ">=3.11,<3.15"
# OpenAI-compatible client — used against the remote Ollama /v1 endpoint.
openai = ">=1.40"
# CLI framework (matches the touchy CLI / googly-vr conventions).
click = ">=8.1"
# Only for the native Ollama /api/chat fallback (exact sampler control).
requests = ">=2.31"
# Speech-to-text for `dankbot listen` — Moonshine Voice streaming models,
# CPU-friendly for the Raspberry Pi target. It bundles its own native library
# (no onnxruntime dependency) and ships prebuilt x86_64 + arm64 wheels.
moonshine-voice = "^0.1.5"
# Microphone capture (PortAudio bindings); moonshine-voice pulls it in too, but
# pinning it here makes the audio layer explicit.
sounddevice = "^0.5.6"
# Terminal logging that mirrors the pad: `HEARD` / `SKIP` / `REPLY` in colour,
# with the quip printed in its display colours (src/dankbot/logs.py). It
# already arrives transitively via touchy-pad; naming it makes the direct
# import honest. `>=13.7` is the first line that carries everything logs.py
# uses (RichHandler + truecolor `#rrggbb` Text styles).
rich = ">=13.7"
# The touchy-pad host library + screen DSL, driven by `dankbot listen`
# (src/dankbot/display.py). Pulled from PyPI; the floor is the first
# release that carries the host API dankbot uses (`SetPropertiesCmd` /
# `build_property_override` + `Label.recolor` from 0.3.5, and
# `Label.scroll_speed_px_s` from 0.3.8, which sets the marquee speed) — anything
# older breaks the display. The long-quip font step-down needs the lb26
# `SetPropertyCmd.font_size_value` override and the published font set that
# enumerates the sizes — 1.0.0 is the release that carries both, and the one that
# compiled the 24-px Montserrat face display.py steps down through. That is the
# floor: `src/dankbot/display.py`'s `FONT_SIZES` (8 / 16 / 24 / 30) must stay a
# subset of the host's, or a tier a pad has no font for raises host-side and the
# quip never draws.
# `just use-touchy-local` swaps in a path dep against
# a clone of upstream main (reference/touchy-pad/app) for host-library work.
touchy-pad = ">=1.0.0"

[tool.poetry.urls]
Homepage = "https://github.com/geeksville/touchy-dankbot"
Repository = "https://github.com/geeksville/touchy-dankbot"
Issues = "https://github.com/geeksville/touchy-dankbot/issues"
Changelog = "https://github.com/geeksville/touchy-dankbot/releases"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.8"

[tool.poetry.scripts]
dankbot = "dankbot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real remote LLM server (skipped unless DANKBOT_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
