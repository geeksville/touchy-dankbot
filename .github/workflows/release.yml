name: Release

# Triggered by pushing a version tag (`vX.Y.Z` — `just bump-version` creates and
# pushes one). Runs the tests, builds the package, and publishes it to PyPI via
# OIDC trusted publishing; no GitHub Release is needed.
#
# PyPI's trusted-publisher entry names the repository, this workflow *filename*
# and the `pypi` environment — not the trigger — so moving from
# `release: published` to a tag push needs no change on PyPI.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Least privilege by default; the publish job widens it with its own block.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # test: lint + test + build the Python package. The publish job depends on it.
  # ---------------------------------------------------------------------------
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A tag publishes whatever version the tree declares, so refuse a mismatch
      # (e.g. a tag pushed without the matching `just bump-version` commit)
      # instead of burning the version number on PyPI.
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' pyproject.toml | head -n1)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject.toml's version $version"
            exit 1
          fi
          echo "Publishing touchy-dankbot $version from tag $GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Pytest
        run: poetry run pytest -q

      - name: Build wheel + sdist
        run: poetry build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: touchy-dankbot-dist
          path: dist/

  # ---------------------------------------------------------------------------
  # publish-pypi: OIDC trusted publish — only runs after tests pass.
  # Configure the "pypi" environment + a trusted publisher for the
  # `touchy-dankbot` project on PyPI (workflow: release.yml).
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/touchy-dankbot
    permissions:
      # `contents: read` is required by attest-build-provenance, and a job-level
      # block *replaces* the top-level one, so restate it here.
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: touchy-dankbot-dist
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
